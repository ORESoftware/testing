[package]
name = "ore-mcp-runtime"
description = "Validated bootstrap ordering and stdio lifecycle helpers for Rust MCP servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["rmcp-stdio"]
rmcp-stdio = ["dep:rmcp", "dep:tracing"]

[dependencies]
ore-mcp-safety = { path = "../ore-mcp-safety", version = "=0.1.0" }
rmcp = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
