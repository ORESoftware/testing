name: patch mcp-rust-libs repair workflow

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-patch-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: true
          fetch-depth: 0

      - name: Patch the semantic repair and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/mcp-rust-libs-repair.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '          gleam_template.write_text(gleam, encoding="utf-8")\n\n          # Rust:'
          insertion = '''          gleam_template.write_text(gleam, encoding="utf-8")

          # The fixture tests construct optional values directly, so their
          # module must import the same Option constructors explicitly.
          gleam_test = Path("packages/gleam/test/result_envelope_test.gleam")
          test_text = gleam_test.read_text(encoding="utf-8")
          test_option_import = "import gleam/option.{None, Some}\\n"
          if test_option_import not in test_text:
              test_anchor = "import gleam/json\\n"
              if test_anchor not in test_text:
                  raise SystemExit("Gleam test import anchor not found")
              test_text = test_text.replace(
                  test_anchor,
                  test_anchor + test_option_import,
                  1,
              )
          gleam_test.write_text(test_text, encoding="utf-8")

          # Rust:'''
          if insertion not in text:
              if anchor not in text:
                  raise SystemExit('repair workflow anchor not found')
              text = text.replace(anchor, insertion, 1)
          workflow.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/mcp-rust-libs-gleam-diagnostic.yml
          rm -f .github/workflows/mcp-rust-libs-patch-repair.yml

      - name: Commit the repair-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: import Gleam Option constructors in contract tests"
          git push origin HEAD:incubator/mcp-rust-libs
