name: Fix Meta-Agent cache bounds once

on:
  push:
    branches:
      - incubator/meta-agent-control-plane

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: incubator/meta-agent-control-plane
          persist-credentials: true

      - name: Add the LRU key bounds required by lru 0.16
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/store.rs')
          text = path.read_text()
          old = 'fn cache_stats<K, V>(cache: &LruCache<K, V>, evictions: u64) -> CacheStats {'
          new = 'fn cache_stats<K: Hash + Eq, V>(cache: &LruCache<K, V>, evictions: u64) -> CacheStats {'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one cache_stats signature, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo +1.97.1 fmt --all || true
          rm .github/workflows/fix-meta-agent-cache-bounds-temporary.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(store): constrain LRU cache key type'
          git push origin HEAD:incubator/meta-agent-control-plane
