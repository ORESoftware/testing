name: Proc isolation lifecycle v1 proof

on:
  pull_request:
    paths:
      - .github/workflows/proc-isolation-lifecycle-v1-proof.yml
      - proc-isolation-lifecycle-proof/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/proc-isolation-lifecycle-v1-proof.yml
      - proc-isolation-lifecycle-proof/**

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Reconstruct exact current lifecycle engine blob
        shell: bash
        run: |
          set -Eeuo pipefail
          file=proc-isolation-lifecycle-proof/src/linux_lifecycle.rs
          test "$(git hash-object "$file")" = 81074add8713f674e6fbd34a88b34d37081982c0
          rustfmt --edition 2024 "$file"
          test "$(grep -Fxc '        file.by_ref()' "$file")" = 1
          sed -i 's/^        file\.by_ref()$/        std::io::Read::by_ref(\&mut file)/' "$file"
          test "$(git hash-object "$file")" = 311ff56d47eba4d228cb6c9e540e6d4c131614d8

      - name: Verify exact production Git blob identities
        shell: bash
        run: |
          set -Eeuo pipefail
          root=proc-isolation-lifecycle-proof
          test "$(git hash-object "$root/.cli-flags.toml")" = cbaeed451962d48507e9a5538aae4ef899349c41
          test "$(git hash-object "$root/src/error.rs")" = 1686b8f363e3ae3215918259f7c57b0d32e8e98d
          test "$(git hash-object "$root/src/flags.rs")" = a6f4785f9cbb0b3913039b10aca69216945fee3d
          test "$(git hash-object "$root/src/lifecycle_host_guard.rs")" = 959c48a3f971ac2df474ebda1dea9976c87ee87b
          test "$(git hash-object "$root/src/linux_lifecycle.rs")" = 311ff56d47eba4d228cb6c9e540e6d4c131614d8
          test "$(git hash-object "$root/src/linux_process_identity.rs")" = d28d9bc04c2bc5065557571b99fd3d5225a28c46
          test "$(git hash-object "$root/vendor/runner.rs")" = 9f6e895f4d961c0ca1090fc6ebf48eb0191c8f3d

      - name: Format exact production modules
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --manifest-path proc-isolation-lifecycle-proof/Cargo.toml -- --check
          rustfmt --edition 2024 --check proc-isolation-lifecycle-proof/vendor/runner.rs

      - name: Run exact lifecycle and parser unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path proc-isolation-lifecycle-proof/Cargo.toml --lib

      - name: Deny Rust and clippy warnings
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --manifest-path proc-isolation-lifecycle-proof/Cargo.toml --all-targets -- -D warnings

      - name: Prove lifecycle dispatch bypasses tenant policy authority
        shell: bash
        run: |
          set -Eeuo pipefail
          file=proc-isolation-lifecycle-proof/vendor/runner.rs
          lifecycle_line="$(grep -n -m1 'if cli.command.is_lifecycle()' "$file" | cut -d: -f1)"
          config_line="$(grep -n -m1 'Config::load_with_expected_sha256' "$file" | cut -d: -f1)"
          test -n "$lifecycle_line"
          test -n "$config_line"
          test "$lifecycle_line" -lt "$config_line"
          grep -F 'execute_linux_lifecycle(runtime_id, operation)?' "$file"
          grep -F 'ram_released_claimed=false' "$file"

      - name: Prove namespace root is not host lifecycle authority
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=proc-isolation-lifecycle-proof/Cargo.toml
          cargo build --manifest-path "$manifest" --bin lifecycle-host-guard
          guard=proc-isolation-lifecycle-proof/target/debug/lifecycle-host-guard

          if "$guard"; then
            echo "ordinary non-root runner unexpectedly received lifecycle authority" >&2
            exit 1
          fi

          sudo "$guard"

          if sudo unshare --user --map-root-user "$guard"; then
            echo "uid 0 inside a nested user namespace unexpectedly received lifecycle authority" >&2
            exit 1
          fi
