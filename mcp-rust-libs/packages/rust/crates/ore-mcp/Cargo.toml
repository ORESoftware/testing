[package]
name = "ore-mcp"
description = "Feature-gated umbrella crate for ORESoftware MCP shared infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["contracts", "safety"]
contracts = ["dep:ore-mcp-contracts"]
safety = ["dep:ore-mcp-safety"]
config = ["dep:ore-mcp-config"]
config-flags2env = ["config", "ore-mcp-config/flags2env-adapter"]
http = ["dep:ore-mcp-http"]
runtime = ["dep:ore-mcp-runtime"]
runtime-rmcp-stdio = ["runtime", "ore-mcp-runtime/rmcp-stdio"]
telemetry = ["dep:ore-mcp-telemetry"]
telemetry-rmcp-instrumentation = ["telemetry", "ore-mcp-telemetry/rmcp-router"]
testkit = ["dep:ore-mcp-testkit"]
full = [
  "contracts",
  "safety",
  "config-flags2env",
  "http",
  "runtime-rmcp-stdio",
  "telemetry-rmcp-instrumentation",
  "testkit",
]

[dependencies]
ore-mcp-config = { path = "../ore-mcp-config", version = "=0.1.0", optional = true, default-features = false }
ore-mcp-contracts = { path = "../ore-mcp-contracts", version = "=0.1.0", optional = true }
ore-mcp-http = { path = "../ore-mcp-http", version = "=0.1.0", optional = true }
ore-mcp-runtime = { path = "../ore-mcp-runtime", version = "=0.1.0", optional = true, default-features = false }
ore-mcp-safety = { path = "../ore-mcp-safety", version = "=0.1.0", optional = true }
ore-mcp-telemetry = { path = "../ore-mcp-telemetry", version = "=0.1.0", optional = true }
ore-mcp-testkit = { path = "../ore-mcp-testkit", version = "=0.1.0", optional = true }

[lints]
workspace = true
