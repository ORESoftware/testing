name: Lifecycle runtime bridges v2 proof

on:
  pull_request:
    paths:
      - ".github/workflows/lifecycle-runtime-bridges-v2-proof.yml"
      - "lifecycle-runtime-bridge-proof/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/lifecycle-runtime-bridges-v2-proof.yml"
      - "lifecycle-runtime-bridge-proof/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact production Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lifecycle-runtime-bridge-proof/vendor/bmscl_host_lifecycle_socket.erl)" = "cc88be0b215faefb047aac5fe5f43e374289f898"
          test "$(git hash-object lifecycle-runtime-bridge-proof/vendor/lambda_host_lifecycle_socket.erl)" = "4150ccc6032bde1e0942076cea050bebbd12ff35"

      - name: Install minimal Erlang compiler/runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends erlang-base erlang-dev

      - name: Compile exact production bridge modules with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lifecycle-bridge-ebin
          erlc -Werror -o /tmp/lifecycle-bridge-ebin lifecycle-runtime-bridge-proof/vendor/bmscl_host_lifecycle_socket.erl
          erlc -Werror -o /tmp/lifecycle-bridge-ebin lifecycle-runtime-bridge-proof/vendor/lambda_host_lifecycle_socket.erl

      - name: Execute BeamScale product-socket path contract
        shell: bash
        run: |
          set -euo pipefail
          erl -noshell -pa /tmp/lifecycle-bridge-ebin -eval '
            {enabled, "/run/beamscale-lifecycle/product/control.sock"} = bmscl_host_lifecycle_socket:validate_socket_path_for_test("/run/beamscale-lifecycle/product/control.sock"),
            {error, invalid_lifecycle_socket_path} = bmscl_host_lifecycle_socket:validate_socket_path_for_test("/run/beamscale-lifecycle/control.sock"),
            {error, invalid_lifecycle_socket_path} = bmscl_host_lifecycle_socket:validate_socket_path_for_test("/run/beamscale-lifecycle/host/control.sock"),
            {error, invalid_lifecycle_socket_path} = bmscl_host_lifecycle_socket:validate_socket_path_for_test("/tmp/attacker.sock"),
            halt(0).'

      - name: Execute Scintilla product-socket path contract
        shell: bash
        run: |
          set -euo pipefail
          erl -noshell -pa /tmp/lifecycle-bridge-ebin -eval '
            {enabled, "/run/scintilla-lifecycle/product/control.sock"} = lambda_host_lifecycle_socket:validate_socket_path_for_test("/run/scintilla-lifecycle/product/control.sock"),
            {error, invalid_lifecycle_socket_path} = lambda_host_lifecycle_socket:validate_socket_path_for_test("/run/scintilla-lifecycle/control.sock"),
            {error, invalid_lifecycle_socket_path} = lambda_host_lifecycle_socket:validate_socket_path_for_test("/run/scintilla-lifecycle/host/control.sock"),
            {error, invalid_lifecycle_socket_path} = lambda_host_lifecycle_socket:validate_socket_path_for_test("/tmp/attacker.sock"),
            halt(0).'
