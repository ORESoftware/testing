[help]
url = "https://github.com/ORESoftware/ores-proc-isolation-cli#usage"
columns = ["options", "env", "type", "default", "description"]

[env]
files = []

[parse]
command_env = "ORES_PI_COMMAND"
positionals_env = "ORES_PI_POSITIONALS"
unknown_options_env = "ORES_PI_UNKNOWN_OPTIONS"
errors_env = "ORES_PI_PARSE_ERRORS"
allow_unknown = false

[flags.config]
env = "ORES_PI_CONFIG"
aliases = ["config", "config-path"]
short = "c"
type = "string"
default = ".ores-proc-isolation.yaml"
help = "Path to the process isolation policy file."

[flags.config-sha256]
env = "ORES_PI_CONFIG_SHA256"
aliases = ["config-sha256"]
type = "string"
default = ""
help = "Optional lowercase SHA-256 digest that the loaded policy bytes must match before admission."

[flags.dry-run]
env = "ORES_PI_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Resolve and print the sandbox plan without launching the target process."

[flags.json]
env = "ORES_PI_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit machine-readable JSON for check, doctor, explain, dry-run, and lifecycle receipt output."

[flags.beamscale-honeypot]
env = "ORES_PI_BEAMSCALE_HONEYPOT"
aliases = ["beamscale-honeypot"]
type = "bool"
default = "false"
help = "Enable the fixed BeamScale host escape tripwire mount/PATH contract on Linux."

[flags.target-env-stdin]
env = "ORES_PI_TARGET_ENV_STDIN"
aliases = ["target-env-stdin"]
type = "bool"
default = "false"
help = "For run only, read a bounded JSON object of target environment values from stdin; values never appear in argv or plan output."

[flags.lifecycle-id]
env = "ORES_PI_LIFECYCLE_ID"
aliases = ["lifecycle-id"]
type = "string"
default = ""
help = "Trusted host lifecycle runtime id. Resolves only under /run/ores-proc-isolation/lifecycle-identities/<id>.json."

[commands.check]
help = "Validate .ores-proc-isolation.yaml and all process/group mappings without launching anything."
env = "ORES_PI_COMMAND_CHECK"

[commands.doctor]
help = "Validate configuration and report host sandbox dependencies for the current platform."
env = "ORES_PI_COMMAND_DOCTOR"

[commands.explain]
help = "Resolve one configured process to its group and effective sandbox policy. Usage: explain <process>."
env = "ORES_PI_COMMAND_EXPLAIN"

[commands.run]
help = "Run one configured process in the fail-closed sandbox. Usage: run <process> -- [extra args...]."
env = "ORES_PI_COMMAND_RUN"

[commands.lifecycle-status]
help = "Report the exact trusted Linux managed-scope lifecycle state selected by --lifecycle-id."
env = "ORES_PI_COMMAND_LIFECYCLE_STATUS"

[commands.lifecycle-freeze]
help = "Freeze the exact trusted Linux managed cgroup-v2 scope selected by --lifecycle-id."
env = "ORES_PI_COMMAND_LIFECYCLE_FREEZE"

[commands.lifecycle-thaw]
help = "Thaw the exact trusted Linux managed cgroup-v2 scope selected by --lifecycle-id."
env = "ORES_PI_COMMAND_LIFECYCLE_THAW"

[commands.lifecycle-reclaim]
help = "Best-effort reclaim memory from the exact frozen Linux managed cgroup-v2 scope selected by --lifecycle-id."
env = "ORES_PI_COMMAND_LIFECYCLE_RECLAIM"
