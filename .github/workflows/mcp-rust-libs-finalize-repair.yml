name: finalize mcp-rust-libs semantic repair

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-finalize-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-rust-libs-finalize-repair
  cancel-in-progress: false

jobs:
  patch-repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: true
          fetch-depth: 0

      - name: Reconcile the repair workflow semantically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/mcp-rust-libs-repair.yml')
          text = workflow.read_text(encoding='utf-8')

          old_test_write = '''          gleam_test.write_text(test_text, encoding="utf-8")

          # Rust:'''
          new_test_write = '''          canonical_gleam_test = Path("packages/gleam/test/ore_mcp_contracts_test.gleam")
          canonical_gleam_test.write_text(test_text, encoding="utf-8")
          if gleam_test != canonical_gleam_test and gleam_test.exists():
              gleam_test.unlink()

          # Rust:'''
          if new_test_write not in text:
              if old_test_write not in text:
                  raise SystemExit('Gleam test-module repair anchor not found')
              text = text.replace(old_test_write, new_test_write, 1)

          old_dart_anchor = '''          generated_mod.write_text(text, encoding="utf-8")

          # Keep the target-repository workflow aligned'''
          new_dart_anchor = '''          generated_mod.write_text(text, encoding="utf-8")

          # Dart libraries no longer require a named library directive. Keep
          # analysis clean instead of carrying a known informational finding.
          dart_entry = Path("packages/dart/lib/ore_mcp_contracts.dart")
          text = dart_entry.read_text(encoding="utf-8")
          text = text.replace("library ore_mcp_contracts;\\n\\n", "", 1)
          dart_entry.write_text(text, encoding="utf-8")

          # Keep the target-repository workflow aligned'''
          if new_dart_anchor not in text:
              if old_dart_anchor not in text:
                  raise SystemExit('Dart entrypoint repair anchor not found')
              text = text.replace(old_dart_anchor, new_dart_anchor, 1)

          old_report = '''          - importing Option constructors in the Gleam contract tests;
          - separating generated-code documentation policy from handwritten Rust exports;'''
          new_report = '''          - importing Option constructors and using the canonical Gleam test module;
          - separating generated-code documentation policy from handwritten Rust exports;'''
          if new_report not in text:
              if old_report not in text:
                  raise SystemExit('repair report anchor not found')
              text = text.replace(old_report, new_report, 1)

          workflow.write_text(text, encoding='utf-8')
          PY

          # These diagnostic/patch workflows have served their purpose. Their
          # behavior is now folded into the single fail-closed repair workflow.
          rm -f \
            .github/workflows/mcp-rust-libs-gleam-diagnostic.yml \
            .github/workflows/mcp-rust-libs-patch-repair.yml \
            .github/workflows/mcp-rust-libs-finalize-repair.yml

      - name: Commit the orchestration repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: make the polyglot repair converge"
          git push origin HEAD:incubator/mcp-rust-libs
