name: ores-cli source-archive validation

on:
  push:
    branches:
      - DEN-2757-ores-cli-validation
    paths:
      - ".github/workflows/ores-cli-private-source-validation.yml"
      - "ores-cli-validation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-source-archive-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_SOURCE_REVISION: 6dbd058080b03eea9aa6971baa98fff13ef78876

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out validation carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify and reconstruct exact private source archive
        shell: bash
        run: |
          set -euo pipefail
          cd ores-cli-validation/archive
          sha256sum --check <<'SUMS'
          067df97d8cd7816ac2d7bb106c9cb2b3baf1725f5718a0b9d0dd0f35fcb4e564  part-00
          cef3cc7b354d9ce885b3dc1725c5a1bb1b7acc19d9546c796adea558d69aa365  part-01
          d172dd31a3b49e5633bb560f4dc8e8e176b2ef29cb52fb53e5527203898c056a  part-02
          953fc908bd12d2a9f14018a2783c414f4b5dae405be40ef8c95af37fd3fa9459  part-03
          79743831d5918f7fca21d35ac800ba135bee29a37c29c6150090a64e0182b7ec  part-04
          5991f74f2fc8613b76c60732c85d596713aa997b06b219f2c61e3919a8d0a6a6  part-05
          SUMS
          cat part-* | base64 --decode > "$RUNNER_TEMP/ores-cli-source.tar.gz"
          echo "cd385a40e43eb8e8b2475b0bb2cc5fa87f9aaa462229cec2fe3ecf49d4e79576  $RUNNER_TEMP/ores-cli-source.tar.gz" | sha256sum --check
          mkdir -p ../source
          tar -xzf "$RUNNER_TEMP/ores-cli-source.tar.gz" -C ../source
          printf '%s\n' "$ORES_CLI_SOURCE_REVISION" > ../source/.validated-source-revision

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy

      - name: Generate dependency lock
        working-directory: ores-cli-validation/source
        run: cargo generate-lockfile

      - name: Check formatting
        working-directory: ores-cli-validation/source
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        working-directory: ores-cli-validation/source
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all tests
        working-directory: ores-cli-validation/source
        run: cargo test --all-targets --all-features --locked

      - name: Exercise repository and package audits
        working-directory: ores-cli-validation/source
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -- audit repo --path . --profile rust-cli > repository-audit.jsonl
          cargo run --quiet --locked -- audit package --path . > package-audit.jsonl
          cargo run --quiet --locked -- --no-json audit package --path . > package-audit.txt
          grep -F 'status=passed command=audit package' package-audit.txt
          python3 - <<'PY'
          import json
          import pathlib
          for path in ("repository-audit.jsonl", "package-audit.jsonl"):
              records = [json.loads(line) for line in pathlib.Path(path).read_text().splitlines()]
              assert records
              assert all(record["schema"] == "next-loggers/v1" for record in records)
              assert records[-1]["fields"]["event.kind"] == "summary"
              assert records[-1]["fields"]["report.exit_code"] == 0
          PY

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-cli-validation-${{ github.run_id }}
          path: |
            ores-cli-validation/source/.validated-source-revision
            ores-cli-validation/source/Cargo.lock
            ores-cli-validation/source/repository-audit.jsonl
            ores-cli-validation/source/package-audit.jsonl
            ores-cli-validation/source/package-audit.txt
          if-no-files-found: warn
          retention-days: 7
