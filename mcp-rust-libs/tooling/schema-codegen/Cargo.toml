
[package]
name = "ore-mcp-codegen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Portable-profile linter and deterministic provenance checker for ORE MCP contracts"
repository = "https://github.com/ORESoftware/mcp-rust-libs"
publish = false

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
