[package]
name = "proc-isolation-lifecycle-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
flags2env = { package = "flags2env", git = "https://github.com/flags-2-env/flags-2-env.git", rev = "3414281ed8d7339d5bfabf951048bff31aa3349e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "=2.0.21"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
