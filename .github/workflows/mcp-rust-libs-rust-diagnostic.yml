name: diagnose mcp-rust-libs Rust repair

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-rust-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "1.97.1" --profile minimal --component clippy,rustfmt

      - name: Apply reviewed generated-code repair in the runner
        working-directory: mcp-rust-libs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path("tooling/schema-codegen/templates/result-envelope.rs.in")
          text = template.read_text(encoding="utf-8")
          if "#![allow(missing_docs)]" not in text:
              anchor = "// sha256: {{SCHEMA_SHA256}}\n\n"
              if anchor not in text:
                  raise SystemExit("generated Rust header anchor not found")
              text = text.replace(anchor, anchor + "#![allow(missing_docs)]\n\n", 1)
          with_meta = "    pub fn with_meta(mut self, meta: Metadata) -> Self {"
          if "    #[must_use]\n" + with_meta not in text:
              if with_meta not in text:
                  raise SystemExit("with_meta builder not found")
              text = text.replace(with_meta, "    #[must_use]\n" + with_meta, 1)
          template.write_text(text, encoding="utf-8")

          lib = Path("packages/rust/crates/ore-mcp-contracts/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          if "/// Schema-generated contract modules and validators.\n" not in text:
              text = text.replace(
                  "pub mod generated;",
                  "/// Schema-generated contract modules and validators.\npub mod generated;",
                  1,
              )
          if "/// SHA-256 digest of the canonical result-envelope schema.\n" not in text:
              text = text.replace(
                  "pub const SCHEMA_DIGEST:",
                  "/// SHA-256 digest of the canonical result-envelope schema.\npub const SCHEMA_DIGEST:",
                  1,
              )
          lib.write_text(text, encoding="utf-8")

          generated_mod = Path("packages/rust/crates/ore-mcp-contracts/src/generated/mod.rs")
          text = generated_mod.read_text(encoding="utf-8")
          if "/// Generated result-envelope types and value validators.\n" not in text:
              text = text.replace(
                  "pub mod result_envelope;",
                  "/// Generated result-envelope types and value validators.\npub mod result_envelope;",
                  1,
              )
          generated_mod.write_text(text, encoding="utf-8")
          PY
          python3 scripts/regenerate-generated.py --write
          cargo +1.97.1 fmt --manifest-path packages/rust/Cargo.toml --all
          cargo +1.97.1 generate-lockfile --manifest-path packages/rust/Cargo.toml

      - name: Reconfirm formatting, tests, and all adapters
        working-directory: mcp-rust-libs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --manifest-path packages/rust/Cargo.toml --all -- --check
          cargo +1.97.1 test --locked --manifest-path packages/rust/Cargo.toml --workspace --all-targets
          cargo +1.97.1 test --locked --manifest-path packages/rust/Cargo.toml --workspace --no-default-features
          cargo +1.97.1 check --locked --manifest-path packages/rust/Cargo.toml --workspace --all-features --all-targets

      - name: Capture strict Clippy output
        working-directory: mcp-rust-libs
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo +1.97.1 clippy --locked --manifest-path packages/rust/Cargo.toml --workspace --all-features --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/clippy.status"
          exit 0

      - name: Capture rustdoc output
        working-directory: mcp-rust-libs
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set +e
          set -o pipefail
          cargo +1.97.1 doc --locked --manifest-path packages/rust/Cargo.toml --workspace --all-features --no-deps 2>&1 | tee "$RUNNER_TEMP/rustdoc.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/rustdoc.status"
          exit 0

      - name: Upload exact Rust diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-rust-libs-rust-diagnostics
          path: |
            ${{ runner.temp }}/clippy.log
            ${{ runner.temp }}/clippy.status
            ${{ runner.temp }}/rustdoc.log
            ${{ runner.temp }}/rustdoc.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic results
        shell: bash
        run: |
          set -euo pipefail
          clippy=$(cat "$RUNNER_TEMP/clippy.status")
          rustdoc=$(cat "$RUNNER_TEMP/rustdoc.status")
          echo "clippy=$clippy rustdoc=$rustdoc"
          test "$clippy" -eq 0
          test "$rustdoc" -eq 0
