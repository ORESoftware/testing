[workspace]
members = [
  "crates/ore-mcp-config",
  "crates/ore-mcp-http",
  "crates/ore-mcp-runtime",
  "crates/ore-mcp-safety",
  "crates/ore-mcp-telemetry",
  "crates/ore-mcp-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ORESoftware/mcp-rust-libs"
homepage = "https://github.com/ORESoftware/mcp-rust-libs"
authors = ["Alexander Mills <alexander.d.mills@gmail.com>"]
publish = false

[workspace.dependencies]
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
