name: Bootstrap GitHub CLI binary

on:
  push:
    branches:
      - bootstrap/gh-cli-v2.97.0-20260818
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify official GitHub CLI
        env:
          GH_VERSION: 2.97.0
          GH_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
        run: |
          set -euo pipefail
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${archive}"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive"
          install -Dm0755 "gh_${GH_VERSION}_linux_amd64/bin/gh" out/gh
          out/gh --version
          sha256sum out/gh > out/gh.sha256
      - name: Upload verified binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gh-linux-amd64-v2.97.0
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
