name: Format Meta-Agent Control Plane once

on:
  push:
    branches:
      - incubator/meta-agent-control-plane

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: incubator/meta-agent-control-plane
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Apply rustfmt and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all
          rm .github/workflows/format-meta-agent-temporary.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply rustfmt'
          git push origin HEAD:incubator/meta-agent-control-plane
