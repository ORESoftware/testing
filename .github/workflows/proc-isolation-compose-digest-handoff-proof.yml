name: Proc isolation compose digest handoff proof

on:
  pull_request:
    paths:
      - .github/workflows/proc-isolation-compose-digest-handoff-proof.yml
      - proc-isolation-lifecycle-proof/COMPOSE_HANDOFF.lock.json
      - proc-isolation-lifecycle-proof/tests/compose_digest_handoff.rs
      - proc-isolation-lifecycle-proof/vendor/compose_policy_digest_handoff.rs
  push:
    branches:
      - master
    paths:
      - .github/workflows/proc-isolation-compose-digest-handoff-proof.yml
      - proc-isolation-lifecycle-proof/COMPOSE_HANDOFF.lock.json
      - proc-isolation-lifecycle-proof/tests/compose_digest_handoff.rs
      - proc-isolation-lifecycle-proof/vendor/compose_policy_digest_handoff.rs

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Verify exact production and consumer identities
        shell: bash
        run: |
          set -Eeuo pipefail
          root=proc-isolation-lifecycle-proof
          test "$(git hash-object "$root/.cli-flags.toml")" = cbaeed451962d48507e9a5538aae4ef899349c41
          test "$(git hash-object "$root/src/flags.rs")" = a6f4785f9cbb0b3913039b10aca69216945fee3d
          test "$(git hash-object "$root/vendor/runner.rs")" = 9f6e895f4d961c0ca1090fc6ebf48eb0191c8f3d
          test "$(git hash-object "$root/vendor/compose_policy_digest_handoff.rs")" = 9335ccd866e9b6be7c248dc470ff4b069a20d815
          jq -e '.head_sha == "09b6488e951462f27d115ca2a1bcb5b826bd4a7c"' "$root/COMPOSE_HANDOFF.lock.json"
          jq -e '.consumer_head_sha == "e7b77e086984912ebf8e8ddecd46919973cacda6"' "$root/COMPOSE_HANDOFF.lock.json"

      - name: Format carrier assertion and exact product test
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo fmt --manifest-path proc-isolation-lifecycle-proof/Cargo.toml -- --check
          rustfmt --edition 2024 --check proc-isolation-lifecycle-proof/vendor/compose_policy_digest_handoff.rs

      - name: Execute compose-shaped argv contract against exact parser
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path proc-isolation-lifecycle-proof/Cargo.toml --test compose_digest_handoff

      - name: Deny warnings in the consumer-shaped carrier test
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clippy --manifest-path proc-isolation-lifecycle-proof/Cargo.toml --test compose_digest_handoff -- -D warnings

      - name: Prove digest admission precedes target environment consumption
        shell: bash
        run: |
          set -Eeuo pipefail
          file=proc-isolation-lifecycle-proof/vendor/runner.rs
          config_line="$(grep -n -m1 'Config::load_with_expected_sha256' "$file" | cut -d: -f1)"
          target_env_line="$(grep -n -m1 'if cli.target_env_stdin' "$file" | cut -d: -f1)"
          test -n "$config_line"
          test -n "$target_env_line"
          test "$config_line" -lt "$target_env_line"
          grep -F 'Config::load_with_expected_sha256(&cli.config_path, cli.config_sha256.as_deref())?' "$file"
