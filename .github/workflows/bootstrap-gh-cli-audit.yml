name: Bootstrap audited GitHub CLI

on:
  push:
    branches:
      - bootstrap/gh-cli-v2.97.0-20260818
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/bootstrap-gh-cli-audit.yml'

permissions:
  contents: read
  attestations: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download, verify, and package official GitHub CLI
        shell: bash
        env:
          GH_VERSION: 2.97.0
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          checksums="gh_${GH_VERSION}_checksums.txt"
          release="https://github.com/cli/cli/releases/download/v${GH_VERSION}"

          curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 5 --connect-timeout 10 --max-time 180 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$release/$archive"
          curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-redirs 5 --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-all-errors \
            --output "$checksums" "$release/$checksums"

          expected_line="$(awk -v name="$archive" '$2 == name {print}' "$checksums")"
          [ "$(printf '%s\n' "$expected_line" | sed '/^$/d' | wc -l)" -eq 1 ] || {
            echo "checksum manifest must contain exactly one entry for $archive" >&2
            exit 1
          }
          printf '%s\n' "$expected_line" | grep -Eq "^[0-9a-f]{64}[[:space:]]+$archive$"
          printf '%s\n' "$expected_line" | sha256sum --check --strict -

          python3 - "$archive" "$GH_VERSION" <<'PY'
          import pathlib
          import shutil
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          prefix = f"gh_{version}_linux_amd64"
          expected_binary = f"{prefix}/bin/gh"
          output = pathlib.Path("out")
          output.mkdir(mode=0o700)

          seen = set()
          total = 0
          binary = None
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              if not 1 <= len(members) <= 256:
                  raise SystemExit(f"unexpected archive member count: {len(members)}")
              for member in members:
                  name = member.name
                  path = pathlib.PurePosixPath(name)
                  if (
                      not name
                      or name in seen
                      or path.is_absolute()
                      or ".." in path.parts
                      or "\\" in name
                      or any(ord(ch) < 32 or ord(ch) == 127 for ch in name)
                      or not (name == prefix or name.startswith(prefix + "/"))
                  ):
                      raise SystemExit(f"unsafe archive member: {name!r}")
                  seen.add(name)
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"unsupported archive member type: {name!r}")
                  if member.isfile():
                      if member.size < 0 or member.size > 100 * 1024 * 1024:
                          raise SystemExit(f"unsafe archive member size: {name!r}")
                      total += member.size
                      if total > 150 * 1024 * 1024:
                          raise SystemExit("archive exceeds expanded-size safety limit")
                  if name == expected_binary:
                      if not member.isfile():
                          raise SystemExit("GitHub CLI binary is not a regular file")
                      binary = member
              if binary is None:
                  raise SystemExit(f"archive does not contain {expected_binary}")
              source = bundle.extractfile(binary)
              if source is None:
                  raise SystemExit("unable to extract GitHub CLI binary")
              with source, (output / "gh").open("wb") as target:
                  shutil.copyfileobj(source, target, length=1024 * 1024)
          (output / "gh").chmod(0o755)
          PY

          version_line="$(out/gh --version | head -n 1)"
          [ "$version_line" = "gh version ${GH_VERSION} (2026-07-31)" ] || {
            echo "unexpected binary version: $version_line" >&2
            exit 1
          }

          out/gh attestation verify "$archive" --repo cli/cli

          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          binary_sha="$(sha256sum out/gh | awk '{print $1}')"
          cat > out/INSTALLATION-METADATA.json <<JSON
          {
            "schema": "oresoftware/audited-gh-bootstrap/v1",
            "sourceRepository": "cli/cli",
            "sourceTag": "v${GH_VERSION}",
            "archive": "$archive",
            "archiveSha256": "$archive_sha",
            "binarySha256": "$binary_sha",
            "releaseChecksumVerified": true,
            "buildProvenanceVerified": true,
            "versionOutput": "$version_line"
          }
          JSON
          chmod 0600 out/INSTALLATION-METADATA.json
          sha256sum out/gh out/INSTALLATION-METADATA.json > out/SHA256SUMS
          chmod 0600 out/SHA256SUMS

      - name: Upload verified binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh-linux-amd64-v2.97.0-audited
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
