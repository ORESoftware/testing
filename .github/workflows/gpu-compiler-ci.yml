name: gpu-compiler-ci

on:
  push:
    branches:
      - "feat/gpu-execution-hardening"
  pull_request:
    paths:
      - "src/main/java/dev/oreslang/compiler/**"
      - "src/main/java/dev/oreslang/parser/**"
      - "src/main/java/dev/oreslang/ast/**"
      - "src/main/java/dev/oreslang/types/**"
      - "src/test/java/dev/oreslang/GpuExecutionTest.java"
      - "src/test/java/dev/oreslang/IncrementalFunctorStaticTest.java"
      - ".github/workflows/gpu-compiler-ci.yml"

permissions:
  contents: read

concurrency:
  group: gpu-compiler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Capture GPU compiler build
        id: gpu_build
        shell: bash
        run: |
          set +e
          mvn -B -ntp -DskipTests compile > gpu-compile.log 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            mvn -B -ntp -Dtest=GpuExecutionTest,IncrementalFunctorStaticTest test > gpu-tests.log 2>&1
            test_status=$?
          else
            printf 'tests skipped because compile failed\n' > gpu-tests.log
            test_status=99
          fi
          printf 'compile_status=%s\ntest_status=%s\n' "$compile_status" "$test_status" > gpu-status.txt
          cat gpu-status.txt
          echo "compile_status=$compile_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload GPU compiler diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: gpu-compiler-diagnostics
          path: |
            gpu-status.txt
            gpu-compile.log
            gpu-tests.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce GPU compiler gate
        shell: bash
        run: |
          test "${{ steps.gpu_build.outputs.compile_status }}" = "0"
          test "${{ steps.gpu_build.outputs.test_status }}" = "0"
