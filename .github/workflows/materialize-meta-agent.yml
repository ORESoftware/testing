name: Materialize and publish Meta-Agent Control Plane

on:
  push:
    branches:
      - incubator/meta-agent-control-plane
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: incubator/meta-agent-control-plane
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          printf '%s  %s\n' \
            '3be3436c7a2b01ab85a68f6de8bd7ec11fed1d8631b0157c315e8362ee21dc63' \
            /tmp/source.tar.gz | sha256sum -c -
          mkdir /tmp/source
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/source.tar.gz')
          root = pathlib.Path('/tmp/source').resolve()
          with tarfile.open(archive, 'r:gz') as tar:
              for member in tar.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'links forbidden: {member.name}')
              tar.extractall(root)
          PY

      - name: Replace bootstrap data with ordinary source without mutating workflows
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize-meta-agent.yml /tmp/materialize-meta-agent.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          test -f .github/workflows/ci.yml
          mv .github/workflows/ci.yml .meta-agent-ci.yml.pending
          cp /tmp/materialize-meta-agent.yml .github/workflows/materialize-meta-agent.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: materialize meta-agent control plane source'
          git push origin HEAD:incubator/meta-agent-control-plane

      - name: Prepare the canonical target tree
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-meta-agent.yml
          git add -A
          git commit -m 'build: remove temporary source carrier workflow'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push the canonical Meta Agents repository
        shell: bash
        env:
          GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.META_AGENTS_DEMO_REPOSITORY_ADMIN_TOKEN || secrets.REMOTE_DEV_GH_PAT || secrets.ORG_GITOPS_TOKEN || secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
          CANONICAL_SHA: ${{ steps.canonical.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_REPOSITORY_ADMIN_TOKEN:-}" ]]; then
            echo '::error::No Meta Agents repository-administration credential is configured.'
            exit 78
          fi
          printf '::add-mask::%s\n' "$GITHUB_REPOSITORY_ADMIN_TOKEN"

          api=https://api.github.com
          headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer $GITHUB_REPOSITORY_ADMIN_TOKEN"
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          status="$(curl --silent --show-error --output /tmp/repo.json --write-out '%{http_code}' \
            "${headers[@]}" \
            "$api/repos/meta-agents-demo/meta-agent-control-plane.rs")"
          case "$status" in
            200)
              echo 'canonical repository already exists'
              ;;
            404)
              create_status="$(curl --silent --show-error --output /tmp/create.json --write-out '%{http_code}' \
                --request POST \
                "${headers[@]}" \
                "$api/orgs/meta-agents-demo/repos" \
                --data '{"name":"meta-agent-control-plane.rs","description":"Single-binary Rust meta-agent daemon and Leptos observability UI","private":false,"has_issues":true,"has_projects":false,"has_wiki":false,"auto_init":false}')"
              test "$create_status" = 201 || {
                echo "repository creation failed with HTTP $create_status" >&2
                cat /tmp/create.json >&2
                exit 1
              }
              ;;
            *)
              echo "repository lookup failed with HTTP $status" >&2
              cat /tmp/repo.json >&2
              exit 1
              ;;
          esac

          ref_status="$(curl --silent --show-error --output /tmp/ref.json --write-out '%{http_code}' \
            "${headers[@]}" \
            "$api/repos/meta-agents-demo/meta-agent-control-plane.rs/git/ref/heads/main")"
          if [[ "$ref_status" = 200 ]]; then
            actual="$(jq -r '.object.sha' /tmp/ref.json)"
            test "$actual" = "$CANONICAL_SHA" || {
              echo "refusing to overwrite existing main: $actual != $CANONICAL_SHA" >&2
              exit 1
            }
            echo "canonical main already verified at $actual"
            exit 0
          fi
          test "$ref_status" = 404 || {
            echo "main ref lookup failed with HTTP $ref_status" >&2
            cat /tmp/ref.json >&2
            exit 1
          }

          cat > /tmp/git-askpass <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *) echo "$GITHUB_REPOSITORY_ADMIN_TOKEN" ;;
          esac
          SH
          chmod 700 /tmp/git-askpass
          git remote remove canonical 2>/dev/null || true
          git remote add canonical https://github.com/meta-agents-demo/meta-agent-control-plane.rs.git
          GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
            git push canonical HEAD:refs/heads/main
          rm -f /tmp/git-askpass

          actual="$(curl --silent --show-error "${headers[@]}" \
            "$api/repos/meta-agents-demo/meta-agent-control-plane.rs/git/ref/heads/main" \
            | jq -r '.object.sha')"
          test "$actual" = "$CANONICAL_SHA"
          echo "published meta-agents-demo/meta-agent-control-plane.rs at $actual"
