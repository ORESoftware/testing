name: repair mcp-rust-libs native formatting

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-repair.yml
      - mcp-rust-libs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-rust-libs-repair-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: true
          fetch-depth: 0

      - name: Detect an already completed repair
        id: repair-state
        shell: bash
        run: |
          if [[ -f mcp-rust-libs/reports/native-repair-complete.txt ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "The pinned native repair has already completed."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust formatter
        if: steps.repair-state.outputs.needed == 'true'
        shell: bash
        run: rustup toolchain install "1.97.1" --profile minimal --component rustfmt

      - name: Install Dart
        if: steps.repair-state.outputs.needed == 'true'
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: "3.12.2"

      - name: Install Gleam
        if: steps.repair-state.outputs.needed == 'true'
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764 # v1.23.0
        with:
          version-type: strict
          gleam-version: "1.17.0"
          otp-version: "29.0.1"

      - name: Apply semantic syntax correction and pinned native formatters
        if: steps.repair-state.outputs.needed == 'true'
        shell: bash
        working-directory: mcp-rust-libs
        run: |
          set -euo pipefail

          # The predicate's policy was correct, but JavaScript-style negated
          # parentheses are not valid Gleam. Replace only the predicate body,
          # using function boundaries rather than whitespace-sensitive matching.
          python3 - <<'PY'
          from pathlib import Path

          template = Path("tooling/schema-codegen/templates/result-envelope.gleam.in")
          text = template.read_text(encoding="utf-8")
          function_start = text.index("fn message_has_only_allowed_controls")
          value_line = text.index("    let value = bit_array.to_int(code_point)", function_start)
          predicate_start = text.index("\n", value_line) + 1
          predicate_end = text.index("\n  })", predicate_start)
          predicate = """    value == 9
              || value == 10
              || value == 13
              || value > 31 && value != 127"""
          template.write_text(
              text[:predicate_start] + predicate + text[predicate_end:],
              encoding="utf-8",
          )
          PY

          python3 scripts/regenerate-generated.py --write
          cargo +1.97.1 fmt --manifest-path packages/rust/Cargo.toml --all
          dart format packages/dart/lib packages/dart/test
          (
            cd packages/gleam
            gleam format src test
          )

          # Native formatters may restyle generated Rust/Dart/Gleam outputs.
          # Copy those exact forms back to their templates while restoring
          # generator placeholders, so regeneration remains byte-deterministic.
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          lock = json.loads((root / "contracts/schema-lock.json").read_text(encoding="utf-8"))
          schema = lock["schemas"][0]
          replacements = (
              (lock["generator"]["version"], "{{GENERATOR_VERSION}}"),
              (schema["id"], "{{SCHEMA_ID}}"),
              (schema["sha256"], "{{SCHEMA_SHA256}}"),
          )
          mapping = json.loads(
              (root / "tooling/schema-codegen/generator-map.json").read_text(encoding="utf-8")
          )
          formatted_suffixes = {".rs", ".dart", ".gleam"}
          for item in mapping["outputs"]:
              output = root / item["output"]
              if output.suffix not in formatted_suffixes:
                  continue
              template = root / item["template"]
              template_text = template.read_text(encoding="utf-8")
              text = output.read_text(encoding="utf-8")
              for actual, placeholder in replacements:
                  if placeholder not in template_text:
                      continue
                  if actual not in text:
                      raise SystemExit(f"missing generated header value {actual!r} in {output}")
                  text = text.replace(actual, placeholder, 1)
              template.write_text(text, encoding="utf-8")
          PY

          python3 scripts/regenerate-generated.py --check
          cargo +1.97.1 generate-lockfile --manifest-path packages/rust/Cargo.toml

          cargo +1.97.1 fmt --manifest-path packages/rust/Cargo.toml --all --check
          dart format --output=none --set-exit-if-changed packages/dart/lib packages/dart/test
          (
            cd packages/gleam
            gleam format --check src test
          )
          python3 scripts/regenerate-generated.py --check

          cat > reports/native-repair-complete.txt <<'EOF'
          Native repair toolchains:
          - Rust 1.97.1 with rustfmt
          - Dart 3.12.2
          - Gleam 1.17.0 on OTP 29.0.1

          Generated Rust, Dart, and Gleam sources were formatted with their
          pinned native tools, synchronized back to generator templates, and
          checked for deterministic regeneration drift. The Gleam control
          predicate was translated to valid equivalent syntax without changing
          the canonical contract policy.
          EOF
          python3 scripts/update-source-manifest.py --write
          python3 scripts/update-source-manifest.py --check

      - name: Commit the exact native repair
        if: steps.repair-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mcp-rust-libs
          if git diff --cached --quiet; then
            echo "native formatting already matched the pinned toolchains"
            exit 0
          fi
          git commit -m "style: apply pinned polyglot MCP formatters"
          git push origin HEAD:incubator/mcp-rust-libs
