name: common desktop Rust distribution proof

on:
  pull_request:
    paths:
      - 'proof/common-desktop-rust-distribution/**'
      - '.github/workflows/common-desktop-rust-distribution-proof.yml'

permissions:
  contents: read

jobs:
  exact-production-validator:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify exact production validator blob
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object proof/common-desktop-rust-distribution/tool/src/main.rs)"
          expected="0dade6e4d5af1b8514b3e112379c7bba53517088"
          test "$actual" = "$expected"
          printf 'verified production blob %s\n' "$actual"

      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.82.0'
          components: rustfmt, clippy

      - name: Generate deterministic proof lockfile
        working-directory: proof/common-desktop-rust-distribution
        run: cargo +1.82.0 generate-lockfile

      - name: Check formatting
        working-directory: proof/common-desktop-rust-distribution
        run: cargo +1.82.0 fmt --all -- --check

      - name: Clippy exact production validator
        working-directory: proof/common-desktop-rust-distribution
        run: cargo +1.82.0 clippy --locked --all-targets -- -D warnings

      - name: Run validator regression tests
        working-directory: proof/common-desktop-rust-distribution
        run: cargo +1.82.0 test --locked --all-targets

      - name: Execute real metadata-to-manifest validation path
        working-directory: proof/common-desktop-rust-distribution
        run: >-
          cargo +1.82.0 run --locked
          -p common-desktop-rust-distribution-proof
          -- distribution/rust-packages.json
