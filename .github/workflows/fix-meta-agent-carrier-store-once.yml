name: Fix and validate Meta-Agent carrier Clippy findings once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-meta-agent-carrier-store-once.yml

permissions:
  contents: write

concurrency:
  group: fix-meta-agent-carrier-store-den-1057
  cancel-in-progress: false

jobs:
  fix-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact carrier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: incubator/meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Require the diagnosed carrier revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = f1d3fb515f1ad9c1876afff07ceadb9d21030cc5

      - name: Collapse only the three behavior-equivalent nested guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/store.rs")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          outer = "            if applied {\n"
          inner = "                if let Some(agent) = inner.agents.get_mut(&agent_id) {\n"
          inner_close = "                }\n"
          outer_close = "            }\n"
          output: list[str] = []
          replacements = 0
          index = 0

          while index < len(lines):
              if index + 1 < len(lines) and lines[index] == outer and lines[index + 1] == inner:
                  output.extend(
                      [
                          "            if applied\n",
                          "                && let Some(agent) = inner.agents.get_mut(&agent_id)\n",
                          "            {\n",
                      ]
                  )
                  index += 2
                  while index + 1 < len(lines) and not (
                      lines[index] == inner_close and lines[index + 1] == outer_close
                  ):
                      output.append(lines[index])
                      index += 1
                  if index + 1 >= len(lines):
                      raise SystemExit("unterminated nested applied/agent guard")
                  output.append(outer_close)
                  index += 2
                  replacements += 1
                  continue
              output.append(lines[index])
              index += 1

          if replacements != 3:
              raise SystemExit(f"expected three exact guard rewrites, found {replacements}")
          path.write_text("".join(output), encoding="utf-8")
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Format and validate the complete carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo +1.97.1 fmt --all
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --all-targets --all-features
          python3 scripts/verify_contract.py
          node --check scripts/dashboard.js
          rm -f Cargo.lock
          git diff --check
          test "$(git status --short)" = ' M src/store.rs'

      - name: Commit and push the validated carrier fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store.rs
          git commit -m 'fix(store): satisfy Rust 1.97 Clippy without changing reducer behavior'
          git push origin HEAD:refs/heads/incubator/meta-agent-control-plane
