name: materialize mcp-rust-libs semantic merge

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-incubator.yml
      - .bootstrap/mcp-rust-libs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-rust-libs-materialize-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: true
          fetch-depth: 0
      - name: Verify and materialize the reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mcp-rust-libs-semantic-merge.tar.gz"
          cat .bootstrap/mcp-rust-libs/chunk-* | base64 --decode > "$archive"
          echo "94a243a2d217557778db638eb94cee46897ec00500d8632074e2ad81657ee65e  $archive" | sha256sum --check --strict
          rm -rf mcp-rust-libs
          tar -xzf "$archive" -C .
          rm -rf .bootstrap/mcp-rust-libs
          test -f mcp-rust-libs/.zpkg.toml
          test -f mcp-rust-libs/packages/rust/Cargo.toml
          test -f mcp-rust-libs/packages/typescript/package.json
          test -f mcp-rust-libs/packages/dart/pubspec.yaml
          test -f mcp-rust-libs/packages/gleam/gleam.toml
          python3 mcp-rust-libs/scripts/update-source-manifest.py --check
      - name: Commit the exact semantic merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "semantic merge already materialized"
            exit 0
          fi
          git commit -m "feat: materialize polyglot MCP commons semantic merge"
          git push origin HEAD:incubator/mcp-rust-libs
