name: diagnose mcp-rust-libs Gleam contracts

on:
  pull_request:
    paths:
      - .github/workflows/mcp-rust-libs-gleam-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-rust-libs-gleam-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gleam-diagnostic:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'incubator/mcp-rust-libs')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: incubator/mcp-rust-libs
          persist-credentials: false

      - name: Install pinned Gleam and Erlang/OTP
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764 # v1.23.0
        with:
          version-type: strict
          gleam-version: "1.17.0"
          otp-version: "29.0.1"

      - name: Apply reviewed Gleam API repair in the runner
        working-directory: mcp-rust-libs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path("tooling/schema-codegen/templates/result-envelope.gleam.in")
          text = template.read_text(encoding="utf-8")
          option_import = "import gleam/option.{type Option, None, Some}\n"
          if option_import not in text:
              text = text.replace("import gleam/list\n", "import gleam/list\n" + option_import, 1)
          text = text.replace("string.UtfCodepoint", "UtfCodepoint")
          template.write_text(text, encoding="utf-8")
          PY
          python3 scripts/regenerate-generated.py --write
          cd packages/gleam
          gleam deps download
          gleam format src test

      - name: Gleam format check
        working-directory: mcp-rust-libs/packages/gleam
        run: gleam format --check src test

      - name: Gleam type check
        working-directory: mcp-rust-libs/packages/gleam
        shell: bash
        run: |
          set -o pipefail
          gleam check 2>&1 | tee "$RUNNER_TEMP/gleam-check.log"
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo '## Gleam type-check failure'
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/gleam-check.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Gleam tests
        working-directory: mcp-rust-libs/packages/gleam
        shell: bash
        run: |
          set -o pipefail
          gleam test 2>&1 | tee "$RUNNER_TEMP/gleam-test.log"
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo '## Gleam test failure'
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/gleam-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
